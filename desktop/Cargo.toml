[package]
name = "c-drive-cleaner"
version = "0.1.0"
description = "C盘清理工具 Tauri 前端"
edition = "2021"
rust-version = "1.77"
license = "MIT"

[[bin]]
name = "c-drive-cleaner"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
walkdir = "2"
glob = "0.3"
blake3 = { version = "1", features = ["rayon"] }
getrandom = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
ureq = { version = "2", default-features = false, features = ["native-tls", "gzip"] }
tauri-plugin-dialog = "2"
windows-sys = { version = "0.59", features = [
    "Win32_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

[profile.dev]
# 调试信息会让 target 目录膨胀到几个 GB，杀毒软件逐文件扫描时编译会慢到不可用。
debug = 0
incremental = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
