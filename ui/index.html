<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>磁盘清理助手</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand" data-tauri-drag-region>
      <div class="logo">C</div>
      <span>磁盘清理助手</span>
    </div>
    <nav id="nav" class="nav"></nav>
    <div class="sidebar-bottom">
      <a href="#" id="history-link">清理历史</a>
      <a href="#" id="rules-link">规则更新</a>
      <a href="#" id="rules-rollback-link">规则回滚</a>
    </div>
  </aside>
  <main class="main">
    <div class="topbar" data-tauri-drag-region>
      <span class="spacer" data-tauri-drag-region></span>
      <button class="win-btn" id="btn-min">—</button>
      <button class="win-btn" id="btn-max">□</button>
      <button class="win-btn" id="btn-close">✕</button>
    </div>
    <section id="page" class="page"></section>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
