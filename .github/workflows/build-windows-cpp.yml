name: Build Windows app (C++)

on:
  workflow_dispatch:
  push:
    branches: [main, "fix/**"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend deps
        working-directory: web
        shell: pwsh
        run: npm ci

      # 前端产物在构建期复制到 exe 旁边（web/），必须先构建。
      - name: Build frontend
        working-directory: web
        shell: pwsh
        run: npm run build

      - name: Fetch third-party dependencies
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File cpp/tools/fetch_deps.ps1

      - name: Configure
        working-directory: cpp
        shell: pwsh
        run: cmake --preset x64-release

      - name: Build
        working-directory: cpp
        shell: pwsh
        run: cmake --build --preset x64-release

      - name: Unit tests
        working-directory: cpp
        shell: pwsh
        run: ctest --preset x64-release --output-on-failure

      - name: Package (NSIS installer + zip)
        working-directory: cpp
        shell: pwsh
        run: cpack --config build/x64-release/CPackConfig.cmake -G "NSIS;ZIP"

      - uses: actions/upload-artifact@v4
        with:
          name: C-drive-cleaner-cpp-${{ github.sha }}
          path: |
            cpp/build/x64-release/*.exe
            cpp/build/x64-release/*.zip
          if-no-files-found: error
